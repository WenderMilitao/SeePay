<div class="grid-container">
  <h1 class="mat-h1">Rendimentos</h1>
  <mat-grid-list cols="{{ (cardLayout | async)?.columns }}" rowHeight="200px">
    <!--Charts-->
    <mat-grid-tile
      *ngFor="let i of [1]"
      [colspan]="(cardLayout | async)?.chart?.cols"
      [rowspan]="(cardLayout | async)?.chart?.rows"
    >
      <app-card title="Cadastro de Rendimentos">
        <div><app-rendimento-form></app-rendimento-form></div>
      </app-card>
    </mat-grid-tile>

    <mat-grid-tile
      *ngFor="let i of [1]"
      [colspan]="(cardLayout | async)?.chart?.cols"
      [rowspan]="(cardLayout | async)?.chart?.rows"
    >
      <app-card>
        <div class="total-card">
          <img
            src="../../../assets/iconcalculator.png"
            alt="calculator_coin_dollar"
          />
          <p class="total">
            Total dos Rendimentos:
            <span class="total">
              {{
                valorTotalRendimentos | currency : "BRL" : "symbol" : "1.2-2"
              }}
            </span>
          </p>

          <p class="saldo">
            Saldo:
            <span>{{ saldo | currency : "BRL" : "symbol" : "1.2-2" }}</span>
          </p>
        </div>
      </app-card>
    </mat-grid-tile>

    <!--Table-->
    <mat-grid-tile
      [colspan]="(cardLayout | async)?.table?.cols"
      [rowspan]="(cardLayout | async)?.table?.rows"
    >
      <app-rendimento-table></app-rendimento-table>
    </mat-grid-tile>
  </mat-grid-list>
</div>
